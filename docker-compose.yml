services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - fraud-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fraud-net

  producer:
    build: .
    command: uv run python -m src.producer
    depends_on:
      - kafka
    environment:
      PYTHONPATH: /app
    networks:
      - fraud-net

  flink-processor:
    build: .
    command: uv run python -m src.flink_processor
    depends_on:
      - kafka
    environment:
      PYTHONPATH: /app
      MODEL_PATH: /app/models/fraud_model.joblib
    volumes:
      - ./models:/app/models
    networks:
      - fraud-net

  alert-consumer:
    build: .
    command: uv run python -m src.alert_consumer
    depends_on:
      - kafka
    environment:
      PYTHONPATH: /app
    networks:
      - fraud-net

  train-model:
    build: .
    command: uv run python -m src.train_model
    volumes:
      - ./models:/app/models
    environment:
      PYTHONPATH: /app
    networks:
      - fraud-net

networks:
  fraud-net:
    driver: bridge
